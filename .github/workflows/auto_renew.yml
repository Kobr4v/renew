name: Auto Renew Tickhosting

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (test login + Telegram, no renewal)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write 

jobs:
  Auto_renew_tickhosting:
    runs-on: windows-latest 
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0
        
    - name: Pull latest changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git pull --rebase origin main
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'
        
    - name: Install Chrome
      uses: browser-actions/setup-chrome@latest

    - name: Clear old ChromeDriver
      run: |
        if (Test-Path "C:\SeleniumWebDrivers\ChromeDriver\chromedriver.exe") { Remove-Item "C:\SeleniumWebDrivers\ChromeDriver\chromedriver.exe" -Force }

    - name: Install ffmpeg
      run: choco install ffmpeg -y

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run auto renew script
      env:
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        PTERODACTYL_SESSION: ${{ secrets.PTERODACTYL_SESSION }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
      run: python auto_renew.py

    - name: Commit and push if changed
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git checkout main
        git add last_renew_data.txt
        git diff --cached --exit-code || git commit -m "Auto Update by Github Actions"
        git pull --rebase origin main || true
        git push origin main
